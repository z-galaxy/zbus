[package]
name = "zbus_utils"
version = "6.1.0"
authors = [
    "Zeeshan Ali Khan <zeeshanak@gnome.org>",
    "turbocooler <turbocooler@cocaine.ninja>",
]
edition = { workspace = true }
rust-version = { workspace = true }

description = "Various utilities used by the zbus and zgvariant crates."
repository = { workspace = true }
keywords = ["D-Bus", "DBus", "IPC", "GVariant"]
license = { workspace = true }
categories = ["data-structures", "encoding", "parsing"]
readme = "README.md"

[features]
default = ["codegen"]
# The code generation of the derives of zbus and zgvariant (the `derive` and `macros` modules),
# which needs syn, quote and proc-macro2.
codegen = ["dep:proc-macro2", "dep:syn", "dep:quote"]
gvariant = []

[dependencies]
proc-macro2 = { workspace = true, optional = true }
syn = { workspace = true, optional = true }
quote = { workspace = true, optional = true }
serde.workspace = true
winnow.workspace = true

[package.metadata.docs.rs]
all-features = true
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-gnu",
    "x86_64-apple-darwin",
    "x86_64-unknown-freebsd",
    "x86_64-unknown-netbsd",
    "aarch64-linux-android",
]

[lints]
workspace = true
