[package]
name = "zbus"
version = "6.2.0"
authors = ["Zeeshan Ali Khan <zeeshanak@gnome.org>"]
edition = { workspace = true }
rust-version = { workspace = true }

description = "API for D-Bus communication and its wire format"
repository = { workspace = true }
keywords = ["D-Bus", "DBus", "IPC", "serde"]
license = { workspace = true }
categories = ["os::unix-apis", "data-structures", "encoding", "parsing"]
readme = "README.md"

[features]
default = [
    "default-rt",
    "proxy",
    "service",
    "object-manager",
    "tracing",
]

# Wire-format optional impls — the former zvariant features, same names.
arrayvec = ["dep:arrayvec"]
camino = ["dep:camino"]
chrono = ["dep:chrono"]
heapless = ["dep:heapless"]
# Enables ser/de of `Option<T>` as an array of 0 or 1 elements.
option-as-array = []
serde_bytes = ["dep:serde_bytes"]
time = ["dep:time"]
url = ["dep:url"]
uuid = ["dep:uuid"]

# The D-Bus API: connection, message, proxy, object server, fdo and friends.
comms = [
    "dep:bitflags",
    "zbus_macros/comms",
    "dep:serde_repr",
    "dep:futures-core",
    "dep:hex",
    "dep:ordered-stream",
    # Without `dep:zruntime`, Cargo would also make `zruntime` a feature of zbus.
    "dep:zruntime",
    "zruntime/broadcast",
    "zruntime/lock",
    "zruntime/unblock",
    "dep:async-trait",
    "dep:rustix",
    "dep:libc",
    "dep:windows-sys",
    "dep:uds_windows",
    "dep:socket2",
    # `guid::validate_guid` parses GUIDs with `uuid` outside any `p2p` gate, so the dependency is
    # needed here. `dep:uuid` rather than `uuid` keeps the `Uuid` wire impls opt-in, as today.
    "dep:uuid",
]
# The runtime zbus ships, provided by zruntime: one runtime per thread that runs
# `zbus::block_on`, driven by that thread (default). The feature is named for the role, not for
# the crate behind it. It also turns on zruntime's TCP and unix-domain sockets, which a connection
# is made through, and its child processes, which the runtime runs a helper process through.
# Cargo cannot turn zruntime's `process` feature on only where `unixexec`, `ibus` or macOS needs
# it, so it is on whenever this feature is, and the backend spawns through it on every unix
# build, as the runtime trait has a spawn of a process there whatever the features.
# `tokio` adds the Tokio backend, which a connection built inside a Tokio runtime prefers. On WASI,
# the Tokio sockets it turns on need `--cfg tokio_unstable`.
default-rt = [
    "comms",
    "zruntime/runtime",
    "zruntime/helper",
    "zruntime/tcp",
    "zruntime/unix",
    "zruntime/process",
]
tokio = ["comms", "dep:tokio"]
# With the `tokio` feature, `zbus::block_on` runs the future on a single-threaded Tokio runtime of
# its own. This makes that runtime a multi-threaded one instead (enables `tokio`).
tokio-multithread = ["tokio", "tokio/rt-multi-thread"]
# Logging through `tracing` (default). With this off, zbus emits no log events or spans, and
# `tokio`'s own `tracing` feature is not enabled either.
tracing = ["dep:tracing", "tokio?/tracing", "zruntime?/tracing"]
# The client-side (proxy) API (default).
proxy = ["comms", "zbus_macros/proxy"]
# The service-side (object server) API (default).
service = ["comms", "zbus_macros/service"]
# The service-side `ObjectManager` implementation, along with the `InterfacesAdded` and
# `InterfacesRemoved` signals the object server emits on its behalf (default).
object-manager = ["service"]
# The `unixexec:` transport, which runs a command and talks D-Bus over its standard I/O. The Tokio
# backend runs the command with Tokio's `process` feature.
unixexec = ["comms", "tokio?/process"]
# The `ibus:` transport, which asks the IBus daemon for its bus address by running `ibus address`.
# The Tokio backend runs the command with Tokio's `process` feature.
ibus = ["comms", "tokio?/process"]
# Enables API that is only needed for peer-to-peer (p2p) connections.
p2p = ["comms", "uuid?/v4"]
# Enables API that is only needed for bus implementations (enables `p2p`).
bus-impl = ["p2p"]

[dependencies]
zbus_macros = { path = "../zbus_macros", version = "6.2.0", default-features = false }
zcheapstr.workspace = true
endi.workspace = true
zbus_utils = { path = "../zbus_utils", version = "6.1.0" }

serde.workspace = true
serde_repr = { workspace = true, optional = true }
bitflags = { workspace = true, optional = true }
futures-core = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
ordered-stream = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
winnow.workspace = true

# zbus's notifications are built on zruntime's `Event`, and its async locks, broadcast channels and
# the thread its default blocking-work hook runs on come from zruntime, through its `event`, `lock`,
# `broadcast` and `unblock` features; the `default-rt` feature turns zruntime's runtime, sockets and
# child processes on as well, and `tracing` its logging. A Tokio build uses Tokio's locks instead.
zruntime = { workspace = true, optional = true }

# Wire-format impls and async-runtime backends.
arrayvec = { workspace = true, optional = true }
camino = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
heapless = { workspace = true, optional = true }
serde_bytes = { workspace = true, optional = true }
time = { workspace = true, optional = true }
url = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["rt", "net", "time", "sync"] }

# The `launchd:` transport runs a program on macOS whatever the features are, so the Tokio backend
# needs Tokio's `process` feature there as well. Cargo adds the features of the two entries up.
[target.'cfg(target_os = "macos")'.dependencies]
tokio = { workspace = true, optional = true, features = ["process"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, optional = true }
uds_windows = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true, optional = true }

# On WASI, rustix is what a socket is read from, written to and switched to non-blocking mode
# through: it has no sockets there, but a socket is a descriptor like any other.
[target.'cfg(any(unix, target_os = "wasi"))'.dependencies]
rustix = { workspace = true, optional = true }

# socket2 does not build for WASI's preview 1, and zbus has no use for it on either preview.
[target.'cfg(not(target_os = "wasi"))'.dependencies]
socket2 = { workspace = true, optional = true }

[dev-dependencies]
zbus_xml.workspace = true

doc-comment.workspace = true
serde_repr.workspace = true
futures-lite.workspace = true
futures-util = { workspace = true, features = [
    "io",
    "async-await-macro",
    "async-await",
] }
ntest.workspace = true
test-log.workspace = true
tokio = { workspace = true, features = [
    "macros",
    "rt-multi-thread",
    "fs",
    "io-util",
    "net",
    "sync",
    "time",
    "test-util",
] }
tracing.workspace = true
tracing-subscriber.workspace = true
tempfile.workspace = true
criterion.workspace = true
serde_json.workspace = true
chrono = { workspace = true, features = [
    "serde",
    "alloc",
], default-features = false }
static_assertions.workspace = true
async-io.workspace = true
async-executor.workspace = true
async-task.workspace = true
polling.workspace = true
bitflags.workspace = true
socket2.workspace = true
libc.workspace = true

# WASI is not among the targets: docs.rs builds with every feature on, and the `tokio` one needs
# `--cfg tokio_unstable` to build for WASI.
[package.metadata.docs.rs]
all-features = true
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-gnu",
    "x86_64-apple-darwin",
    "x86_64-unknown-freebsd",
    "x86_64-unknown-netbsd",
    "aarch64-linux-android",
]

[lints]
workspace = true

[lib]
bench = false

# Each bench target is measured on CodSpeed by one of the two jobs of
# `.github/workflows/bench.yml`, which lists it: by CPU simulation, or by the clock.
[[bench]]
name = "benchmarks"
harness = false
required-features = ["comms"]

[[bench]]
name = "runtime"
harness = false
required-features = ["p2p"]

[[bench]]
name = "names"
harness = false

[[bench]]
name = "wire"
harness = false

[[example]]
name = "screen-brightness"
path = "examples/screen-brightness.rs"
required-features = ["proxy"]

[[example]]
name = "watch-systemd-jobs"
path = "examples/watch-systemd-jobs.rs"
required-features = ["default-rt", "proxy"]
