[package]
name = "zbus"
version = "6.0.0"
authors = ["Zeeshan Ali Khan <zeeshanak@gnome.org>"]
edition = { workspace = true }
rust-version = { workspace = true }

description = "API for D-Bus communication"
repository = { workspace = true }
keywords = ["D-Bus", "DBus", "IPC"]
license = { workspace = true }
categories = ["os::unix-apis"]
readme = "README.md"

[features]
default = [
    "async-io",
    "blocking-api",
    "proxy",
    "service",
    "object-manager",
    "unixexec",
    "ibus",
    "tracing",
]

# Wire-format optional impls — the former zvariant features, same names.
arrayvec = ["dep:arrayvec"]
camino = ["dep:camino"]
chrono = ["dep:chrono"]
enumflags2 = ["dep:enumflags2"]
heapless = ["dep:heapless"]
# Enables ser/de of `Option<T>` as an array of 0 or 1 elements.
option-as-array = []
serde_bytes = ["dep:serde_bytes"]
time = ["dep:time"]
url = ["dep:url"]
uuid = ["dep:uuid"]

# The D-Bus API: connection, message, proxy, object server, fdo and friends.
comms = [
    "enumflags2",
    "zbus_macros/comms",
    "dep:serde_repr",
    "dep:futures-core",
    "dep:futures-lite",
    "dep:async-broadcast",
    "dep:hex",
    "dep:ordered-stream",
    "dep:event-listener",
    "dep:async-trait",
    "dep:async-recursion",
    "dep:rustix",
    "dep:libc",
    "dep:windows-sys",
    "dep:uds_windows",
    # `guid::validate_guid` parses GUIDs with `uuid` outside any `p2p` gate, so the dependency is
    # needed here. `dep:uuid` rather than `uuid` keeps the `Uuid` wire impls opt-in, as today.
    "dep:uuid",
]
async-io = [
    "comms",
    "dep:async-io",
    "async-executor",
    "async-task",
    "async-lock",
    # FIXME: We only currently only need this for unix but Cargo doesn't provide a way to enable
    # features for only specific target OS: https://github.com/rust-lang/cargo/issues/1197.
    "async-process",
    "blocking",
]
tokio = ["comms", "dep:tokio"]
# Logging through `tracing` (default). With this off, zbus emits no log events or spans, and
# `tokio`'s own `tracing` feature is not enabled either.
tracing = ["dep:tracing", "tokio?/tracing"]
vsock = ["dep:vsock", "async-io"]
tokio-vsock = ["dep:tokio-vsock", "tokio"]
# Enable blocking API (default).
blocking-api = ["comms"]
# The client-side (proxy) API (default).
proxy = ["comms", "zbus_macros/proxy"]
# The service-side (object server) API (default).
service = ["comms", "zbus_macros/service"]
# The service-side `ObjectManager` implementation, along with the `InterfacesAdded` and
# `InterfacesRemoved` signals the object server emits on its behalf (default).
object-manager = ["service"]
# The `unixexec:` transport, which runs a command and talks D-Bus over its standard I/O
# (default).
unixexec = ["comms"]
# The `ibus:` transport, which asks the IBus daemon for its bus address by running `ibus address`
# (default).
ibus = ["comms"]
# Enables API that is only needed for peer-to-peer (p2p) connections.
p2p = ["comms", "uuid?/v4"]
# Enables API that is only needed for bus implementations (enables `p2p`).
bus-impl = ["p2p"]

[dependencies]
zbus_macros = { path = "../zbus_macros", version = "6.0.0", default-features = false }
zcheapstr.workspace = true
endi.workspace = true
zbus_utils = { path = "../zbus_utils", version = "6.0.0" }

serde.workspace = true
serde_repr = { workspace = true, optional = true }
enumflags2 = { workspace = true, optional = true }
futures-core = { workspace = true, optional = true }
futures-lite = { workspace = true, optional = true }
async-broadcast = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
ordered-stream = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
event-listener = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
winnow.workspace = true

# Wire-format impls and async-runtime backends.
arrayvec = { workspace = true, optional = true }
camino = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
heapless = { workspace = true, optional = true }
serde_bytes = { workspace = true, optional = true }
time = { workspace = true, optional = true }
url = { workspace = true, optional = true }
async-io = { workspace = true, optional = true }
async-lock = { workspace = true, optional = true }
async-executor = { workspace = true, optional = true }
blocking = { workspace = true, optional = true }
async-task = { workspace = true, optional = true }
async-process = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = [
    "rt",
    "rt-multi-thread",
    "net",
    "time",
    "fs",
    "io-util",
    # FIXME: We should only enable this feature for unix. See comment above regarding `async-process`
    # on why we can't.
    "process",
    "sync",
] }

[target.'cfg(target_os = "linux")'.dependencies]
vsock = { workspace = true, optional = true }
tokio-vsock = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, optional = true }
uds_windows = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, optional = true }
libc = { workspace = true, optional = true }
async-recursion = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies.async-recursion]
workspace = true
optional = true

[dev-dependencies]
zbus_xml.workspace = true

doc-comment.workspace = true
serde_repr.workspace = true
futures-util = { workspace = true, features = [
    "io",
    "async-await-macro",
    "async-await",
] }
ntest.workspace = true
test-log.workspace = true
tokio = { workspace = true, features = [
    "macros",
    "rt-multi-thread",
    "fs",
    "io-util",
    "net",
    "sync",
    "time",
    "test-util",
] }
tracing.workspace = true
tracing-subscriber.workspace = true
tempfile.workspace = true
criterion.workspace = true
serde_json.workspace = true
chrono = { workspace = true, features = [
    "serde",
    "alloc",
], default-features = false }
static_assertions.workspace = true

[package.metadata.docs.rs]
# we can't use:
# all-features = true
# because some features (such as vsock) are target-specific
features = [
    "async-io",
    "blocking-api",
    "comms",
    "arrayvec",
    "camino",
    "chrono",
    "enumflags2",
    "heapless",
    "option-as-array",
    "serde_bytes",
    "time",
    "url",
    "uuid",
    "bus-impl",
    "p2p",
    "tokio",
    "object-manager",
    "unixexec",
    "ibus",
    "tracing",
]
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-gnu",
    "x86_64-apple-darwin",
    "x86_64-unknown-freebsd",
    "x86_64-unknown-netbsd",
    "aarch64-linux-android",
]

[lints]
workspace = true

[lib]
bench = false

[[bench]]
name = "benchmarks"
harness = false
required-features = ["comms"]

[[bench]]
name = "concurrent_method_calls"
harness = false
required-features = ["p2p", "service"]

[[bench]]
name = "names"
harness = false

[[bench]]
name = "wire"
harness = false

[[example]]
name = "screen-brightness"
path = "examples/screen-brightness.rs"
required-features = ["blocking-api"]

[[example]]
name = "watch-systemd-jobs"
path = "examples/watch-systemd-jobs.rs"
required-features = ["async-io", "proxy"]
