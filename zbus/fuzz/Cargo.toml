[package]
name = "zbus-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.7"
endi = "1.1.0"
serde = "1.0.229"

[dependencies.zbus]
path = ".."
default-features = false
# `comms` for the D-Bus API: the `header` target decodes messages with it, and the `body` target
# checks bodies with it. `bus-impl` for `Message::with_sender`, which the `header` target checks.
features = ["comms", "bus-impl"]

# Prevent this from interfering with workspaces
[workspace]
members = ["."]

[[bin]]
name = "dbus"
path = "fuzz_targets/dbus.rs"
test = false
doc = false

[[bin]]
name = "header"
path = "fuzz_targets/header.rs"
test = false
doc = false

[[bin]]
name = "body"
path = "fuzz_targets/body.rs"
test = false
doc = false
