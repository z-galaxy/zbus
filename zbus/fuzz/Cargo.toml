[package]
name = "zbus-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.7"
endi = "1.1.0"
serde = "1.0.229"

[dependencies.zbus]
path = ".."
default-features = false
# The part of the D-Bus API that needs no connection, for the `header` target to decode messages
# with and the `body` target to check bodies with, and the deprecated `bus-impl`, for the deprecated
# `Message::with_sender`, which the `header` target checks too, until zbus 7 removes both.
features = ["core", "bus-impl"]

# Prevent this from interfering with workspaces
[workspace]
members = ["."]

[[bin]]
name = "dbus"
path = "fuzz_targets/dbus.rs"
test = false
doc = false

[[bin]]
name = "header"
path = "fuzz_targets/header.rs"
test = false
doc = false

[[bin]]
name = "body"
path = "fuzz_targets/body.rs"
test = false
doc = false
