[package]
name = "zbus_macros"
# Keep version in sync with zbus crate
version = "5.19.0"
authors = [
    "Marc-André Lureau <marcandre.lureau@redhat.com>",
    "Zeeshan Ali Khan <zeeshanak@gnome.org>",
]
edition = { workspace = true }
rust-version = { workspace = true }

description = "proc-macros for zbus"
repository = { workspace = true }
keywords = ["D-Bus", "DBus", "IPC"]
license = { workspace = true }
categories = ["data-structures", "encoding", "parsing"]
readme = "README.md"

[features]
default = []
# Compatibility feature; blocking proxy generation follows zbus's blocking-api
# feature, not the features of this host-side procedural macro crate.
blocking-api = []
# Deprecated: GVariant support has moved to the `zgvariant` crate and will be removed in 6.0.
# This feature is an unused pass-through kept only for compatibility until then.
gvariant = ["zvariant/gvariant", "zvariant_utils/gvariant"]

[lib]
proc-macro = true

[dependencies]
proc-macro2.workspace = true
syn = { workspace = true, features = ["extra-traits", "fold", "full"] }
quote.workspace = true
proc-macro-crate.workspace = true

zvariant = { path = "../zvariant", version = "5.15.0" }
zbus_names = { path = "../zbus_names", version = "4.3.4" }
zvariant_utils = { path = "../zvariant_utils", version = "4.1.0" }

[dev-dependencies]
zbus.workspace = true
serde.workspace = true
async-io.workspace = true
futures-util.workspace = true

[package.metadata.docs.rs]
all-features = true
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-gnu",
    "x86_64-apple-darwin",
    "x86_64-unknown-freebsd",
    "x86_64-unknown-netbsd",
    "aarch64-linux-android",
]

[lints]
workspace = true
