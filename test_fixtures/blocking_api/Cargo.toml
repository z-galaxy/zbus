[package]
name = "blocking_api_fixture"
version = "0.0.0"
edition = { workspace = true }
rust-version = { workspace = true }
publish = false

description = "Compile-only fixture: a blocking-API host zbus with an async-only target zbus"

[features]
# Turn the blocking API on for the *target* zbus, so the blocking proxies are expected to exist.
target-blocking = ["renamed_zbus/blocking-api"]

[dependencies]
# Renamed on purpose: the blocking gate is emitted through the `crate` path, so the default
# `::zbus` name would not catch a path that fails to forward.
# `builtin-runtime` rather than `tokio` because the split being tested is `blocking-api`, and the
# runtime is beside the point: the workspace-wide Clippy runs unify this member's features with
# the other members', so asking for `tokio` there would turn it on for a build that otherwise
# never has it.
renamed_zbus = { package = "zbus", path = "../../zbus", default-features = false, features = [
    "builtin-runtime",
    "proxy",
] }

[build-dependencies]
# The whole point of this fixture: Cargo unifies the features of host dependencies separately from
# the target ones, so this enables `blocking-api` in the (host) zbus while the (target) zbus above
# leaves it off. The macros must not act on their own features.
renamed_zbus = { package = "zbus", path = "../../zbus", default-features = false, features = [
    "builtin-runtime",
    "proxy",
    "blocking-api",
] }

[lints]
workspace = true
