name: Lint, Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  MSRV:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings
      MSRV: 1.87.0
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.MSRV }}
          targets: x86_64-pc-windows-gnu, x86_64-apple-darwin, x86_64-unknown-freebsd, x86_64-unknown-netbsd, aarch64-linux-android
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check build with MSRV
        run: |
          cargo --locked check
          cargo --locked check --target x86_64-pc-windows-gnu
          cargo --locked check --target x86_64-apple-darwin
          cargo --locked check --target x86_64-unknown-freebsd
          cargo --locked check --target x86_64-unknown-netbsd
          cargo --locked check --target aarch64-linux-android
          # The wire-format-only build: the drop-in replacement for zvariant 5.
          cargo --locked check -p zbus --no-default-features
          cargo --locked check -p zbus --no-default-features --target x86_64-pc-windows-gnu
          cargo --locked check -p zbus --no-default-features --target x86_64-apple-darwin
          cargo --locked check -p zbus --no-default-features --target x86_64-unknown-freebsd
          cargo --locked check -p zbus --no-default-features --target x86_64-unknown-netbsd
          cargo --locked check -p zbus --no-default-features --target aarch64-linux-android
          # The external-runtime-only build: no async-io, no tokio.
          EXT=async-lock,blocking-api,proxy,service,object-manager,unixexec,ibus,tracing,p2p
          cargo --locked check -p zbus --no-default-features --features $EXT
          cargo --locked check -p zbus --no-default-features --features $EXT \
            --target x86_64-pc-windows-gnu
          cargo --locked check -p zbus --no-default-features --features $EXT \
            --target x86_64-apple-darwin
        # This would be nice but some optional deps (e.g `time`) move very fast wrt to MSRV.
        # cargo --locked check --all-features

  fmt:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings
      RUST_BACKTRACE: full
      RUST_LOG: trace
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          # We use some nightly fmt options.
          toolchain: nightly
          components: rustfmt
          targets: x86_64-apple-darwin, x86_64-unknown-freebsd, x86_64-unknown-netbsd, x86_64-pc-windows-gnu, aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: |
          cargo --locked fmt -- --check
          cargo --locked check --target x86_64-apple-darwin
          cargo --locked check --target x86_64-unknown-freebsd
          cargo --locked check --target x86_64-unknown-netbsd
          cargo --locked check --target x86_64-pc-windows-gnu
          cargo --locked check --target aarch64-linux-android

  clippy:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings
      RUST_BACKTRACE: full
      RUST_LOG: trace
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: clippy
          targets: x86_64-apple-darwin, x86_64-unknown-freebsd, x86_64-unknown-netbsd, x86_64-pc-windows-gnu, aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: Catch common mistakes and unwrap calls
        run: |
          cargo --locked clippy
          cargo --locked clippy --target x86_64-apple-darwin
          cargo --locked clippy --target x86_64-unknown-freebsd
          cargo --locked clippy --target x86_64-unknown-netbsd
          cargo --locked clippy --target x86_64-pc-windows-gnu
          cargo --locked clippy --target aarch64-linux-android
          # The wire-format-only build: the drop-in replacement for zvariant 5.
          cargo --locked clippy -p zbus --no-default-features --all-targets
          cargo --locked clippy -p zbus --no-default-features --target x86_64-apple-darwin
          cargo --locked clippy -p zbus --no-default-features --target x86_64-unknown-freebsd
          cargo --locked clippy -p zbus --no-default-features --target x86_64-unknown-netbsd
          cargo --locked clippy -p zbus --no-default-features --target x86_64-pc-windows-gnu
          cargo --locked clippy -p zbus --no-default-features --target aarch64-linux-android
          # The proxy and service API can be disabled independently. `--all-targets` covers the
          # tests, examples and benchmarks, whose `required-features` must match what they use.
          cargo --locked clippy -p zbus --no-default-features --all-targets \
            --features async-io,blocking-api,p2p
          cargo --locked clippy -p zbus --no-default-features --all-targets \
            --features async-io,blocking-api,p2p,proxy
          cargo --locked clippy -p zbus --no-default-features --all-targets \
            --features async-io,blocking-api,p2p,service
          cargo --locked clippy -p zbus --no-default-features --all-targets \
            --features tokio,p2p,proxy
          cargo --locked clippy -p zbus --no-default-features --all-targets \
            --features tokio,p2p,service
          cargo --locked clippy -p zbus --no-default-features --all-targets \
            --features async-io,proxy,service,unixexec
          cargo --locked clippy -p zbus --no-default-features --all-targets \
            --features async-io,proxy,service,ibus
          cargo --locked clippy -p zbus --no-default-features --all-targets \
            --features async-lock,proxy,service,ibus
          # The external-runtime-only build: no async-io, no tokio.
          EXT=async-lock,blocking-api,proxy,service,object-manager,unixexec,ibus,tracing,p2p
          cargo --locked clippy -p zbus --no-default-features --all-targets --features $EXT
          # The service-only and blocking-API fixtures have to be built on their own: in a
          # workspace-wide build, the features of their `zbus` dependency are unified with those of
          # the other members.
          cargo --locked clippy -p service_only_fixture
          cargo --locked clippy -p blocking_api_fixture
          cargo --locked clippy -p blocking_api_fixture --features target-blocking
          cargo --locked clippy -p geoclue_service_fixture -p geoclue_client_fixture
          cargo --locked clippy -p geoclue_service_fixture -p geoclue_client_fixture \
            --no-default-features --features tokio

  linux_test:
    runs-on: ubuntu-latest
    needs: [fmt, clippy]
    strategy:
      fail-fast: false
      matrix:
        # Every suite builds the workspace with a different feature set, so they run as
        # separate jobs, in parallel, each with a dependency cache of its own.
        suite:
          - all-features
          - default
          - async-io
          - tokio
          - tokio-async-io
          - external
          - wire
    env:
      RUSTFLAGS: -D warnings
      RUST_BACKTRACE: full
      RUST_LOG: trace
    steps:
      - uses: actions/checkout@v7
      - name: Setup
        run: |
          sudo mkdir -p /run/user/$UID |
          sed -e s/UID/$UID/ -e s/PATH/path/ CI/dbus-session.conf > /tmp/dbus-session.conf
          sed -e s/UID/$UID/ -e s/PATH/abstract/ CI/dbus-session.conf > /tmp/dbus-session-abstract.conf
          sudo apt-get update
          sudo apt-get install -y dbus ibus
          # Start IBus daemon for IBus test.
          ibus-daemon -d --xim
          sleep 2
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          # The dependencies are compiled with a different feature set in every suite, so a
          # shared cache would only ever hold the set of the suite that saved it.
          key: ${{ matrix.suite }}
          cache-on-failure: true
      - name: Test all workspace features together
        if: matrix.suite == 'all-features'
        run: |
          dbus-run-session --config-file /tmp/dbus-session.conf -- \
            cargo --locked test --release --verbose --all-features \
              -- --skip fdpass_systemd
      - name: Test the default features over an abstract socket
        if: matrix.suite == 'default'
        run: |
          dbus-run-session --config-file /tmp/dbus-session-abstract.conf -- \
            cargo --locked test --release --verbose -- basic_connection
      - name: Test the full zbus suite with async-io but without Tokio
        if: matrix.suite == 'async-io'
        run: |
          dbus-run-session --config-file /tmp/dbus-session.conf -- \
            cargo --locked test --release --verbose -p zbus \
              --features uuid,url,time,chrono,option-as-array,vsock,bus-impl \
              -- --skip fdpass_systemd
      - name: Test the doc examples with the proxy or service API disabled
        if: matrix.suite == 'async-io'
        run: |
          # With and without the blocking API.
          dbus-run-session --config-file /tmp/dbus-session.conf -- \
            cargo --locked test --release --verbose --doc -p zbus --no-default-features \
              --features async-io,proxy
          dbus-run-session --config-file /tmp/dbus-session.conf -- \
            cargo --locked test --release --verbose --doc -p zbus --no-default-features \
              --features async-io,service
          dbus-run-session --config-file /tmp/dbus-session.conf -- \
            cargo --locked test --release --verbose --doc -p zbus --no-default-features \
              --features async-io,blocking-api,proxy
          dbus-run-session --config-file /tmp/dbus-session.conf -- \
            cargo --locked test --release --verbose --doc -p zbus --no-default-features \
              --features async-io,blocking-api,service
      - name: Test tokio support
        if: matrix.suite == 'tokio'
        run: |
          dbus-run-session --config-file /tmp/dbus-session.conf -- \
            cargo --locked test --release --verbose --tests -p zbus --no-default-features \
              --features tokio,proxy,service -- --skip fdpass_systemd
          # The doc examples have to build without the default async-io runtime, driven by tokio
          # instead. `-p zbus` is load-bearing: a workspace-wide `--no-default-features` is undone
          # by zbus_xmlgen's default-featured zbus dependency.
          dbus-run-session --config-file /tmp/dbus-session.conf -- \
            cargo --locked test --release --verbose --doc -p zbus --no-default-features \
              --features tokio,service
      - name: Test tokio and async-io enabled together
        if: matrix.suite == 'tokio-async-io'
        run: |
          # The features are additive, so the backend is then chosen at run time.
          dbus-run-session --config-file /tmp/dbus-session.conf -- \
            cargo --locked test --release --verbose -p zbus --features tokio,p2p,vsock \
              -- --skip fdpass_systemd
      - name: Test the external-runtime-only build
        if: matrix.suite == 'external'
        run: |
          FEATURES=async-lock,blocking-api,proxy,service,object-manager,unixexec,ibus,tracing,p2p
          # `--tests` over `--lib`: the integration test targets have to build in this feature
          # set too, not only the library's own unit tests. `--doc` is left out: the rendered
          # examples connect to a bus, which a build with neither backend has no runtime for.
          dbus-run-session --config-file /tmp/dbus-session.conf -- \
            cargo --locked test --release --verbose -p zbus --no-default-features \
              --features $FEATURES --tests
          # Nothing behind the async-io feature may reach an external-runtime user. `async-lock`
          # is the exception: it is a lock crate with no threads and no reactor of its own, and
          # this build asks for it by feature to get zbus's locks. The tree is written out before
          # it is searched, so that a `cargo tree` failure fails the job instead of handing grep an
          # empty stream. A `cargo tree` line is a prefix of box-drawing characters, the crate
          # name and its version, so matching from the start of the line up to the version is what
          # keeps a crate whose name merely contains one of these from counting.
          FORBIDDEN="async-io|async-executor|async-task|async-process|blocking"
          FORBIDDEN="$FORBIDDEN|polling|async-channel|async-signal|piper"
          cargo --locked tree -e normal -p zbus --no-default-features --features $FEATURES \
            > /tmp/external-tree.txt
          if grep -E "^[^a-zA-Z0-9]*($FORBIDDEN) v" /tmp/external-tree.txt; then
            echo "a crate owned by the async-io feature is in the external-only graph" >&2
            exit 1
          fi
      - name: Test the wire-format-only build
        if: matrix.suite == 'wire'
        run: |
          # No D-Bus API, so no session bus is needed.
          cargo --locked test --release --verbose -p zbus --no-default-features
          cargo --locked test --release --verbose -p zbus --no-default-features \
            --features arrayvec,camino,chrono,enumflags2,heapless \
            --features option-as-array,serde_bytes,time,url,uuid
      - name: Test zbus with zbus_utils/gvariant enabled (zgvariant coexistence)
        if: matrix.suite == 'wire'
        run: |
          # Simulates the graph a zgvariant 2.0 dependency creates: it turns the shared crate's
          # `gvariant` feature on, and Cargo unification hands zbus the extra signature and
          # format variants it must keep rejecting.
          cargo --locked test -p zbus --no-default-features --features zbus_utils/gvariant
          # The same graph with the D-Bus API on: the message header carries a body signature
          # that must be rejected too.
          dbus-run-session --config-file /tmp/dbus-session.conf -- \
            cargo --locked test -p zbus --no-default-features --features zbus_utils/gvariant,async-io

  windows_test:
    runs-on: windows-latest
    needs: [fmt, clippy]
    strategy:
      fail-fast: false
      matrix:
        # The two suites build zbus with different feature sets, so they run as separate jobs,
        # in parallel, each with a dependency cache of its own.
        suite:
          - default
          - no-default-features
    env:
      RUSTFLAGS: -D warnings
      RUST_BACKTRACE: full
      RUST_LOG: trace
      ErrorActionPreference: Stop
      WarningPreference: Stop
    steps:
      - uses: actions/checkout@v7

      - name: Cache Dependencies
        id: cache-deps
        uses: actions/cache@v6
        with:
          path: |
            C:\vcpkg\installed
            C:\vcpkg\buildtrees
            C:\vcpkg\downloads
          key: ${{ runner.os }}-cache

      - name: Install vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg C:\vcpkg
          cd C:\vcpkg
          .\bootstrap-vcpkg.bat

      - name: Install dependencies via vcpkg
        shell: cmd
        run: |
          C:\vcpkg\vcpkg.exe install ^
            dbus:x64-windows
          C:\vcpkg\vcpkg.exe integrate install
          echo C:\vcpkg\installed\x64-windows\tools\dbus>> %GITHUB_PATH%

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          # The dependencies are compiled with a different feature set in every suite, so a
          # shared cache would only ever hold the set of the suite that saved it.
          key: ${{ matrix.suite }}
          cache-on-failure: true
      - name: Test the default features
        if: matrix.suite == 'default'
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          Start-Process C:\vcpkg\installed\x64-windows\tools\dbus\dbus-daemon.exe '--config-file=CI/win32-session.conf --address=autolaunch:'
          cargo --locked test
      - name: Test the tokio-only and wire-format-only builds
        if: matrix.suite == 'no-default-features'
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          Start-Process C:\vcpkg\installed\x64-windows\tools\dbus\dbus-daemon.exe '--config-file=CI/win32-session.conf --address=autolaunch:'
          # The tokio-only build. `-p zbus` is load-bearing: a workspace-wide
          # `--no-default-features` is undone by zbus_xmlgen's default-featured zbus dependency.
          # `--tests` because the doc examples assume the async-io runtime.
          cargo --locked test -p zbus --no-default-features --features tokio,proxy,service --tests
          # The wire-format-only build.
          cargo --locked test -p zbus --no-default-features
          cargo --locked test -p zbus --no-default-features `
            --features arrayvec,camino,chrono,enumflags2,heapless `
            --features option-as-array,serde_bytes,time,url,uuid

  zbus_fuzz:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings
      RUST_BACKTRACE: full
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@v2
      - name: Fuzz the D-Bus wire format
        run: |
          # `cargo fuzz` does not propagate `--locked` to its inner cargo invocation, so check
          # the nested lockfile explicitly.
          cargo metadata --manifest-path zbus/fuzz/Cargo.toml --locked --format-version 1 \
            > /dev/null
          cargo install cargo-fuzz
          cargo --locked fuzz run --fuzz-dir zbus/fuzz dbus -- -max_total_time=30 -max_len=100M

  doc_build:
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - name: Check zbus documentation build
        run: cargo --locked doc --all-features -p zbus
      - name: Check wire-format-only documentation build
        run: cargo --locked doc --no-default-features -p zbus
      - name: Check documentation build with the proxy or service API disabled
        run: |
          cargo --locked doc --no-default-features --features async-io,proxy -p zbus
          cargo --locked doc --no-default-features --features async-io,service -p zbus
          cargo --locked doc --no-default-features --features async-io,blocking-api,proxy -p zbus
          cargo --locked doc --no-default-features --features async-io,blocking-api,service -p zbus
      - name: Check zbus_xml documentation build
        run: cargo --locked doc --all-features -p zbus_xml

  semver-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Check semver
        uses: obi1kenobi/cargo-semver-checks-action@v2
