name: CodSpeed Benchmarks

on:
  push:
    branches:
      - "main" # or "master"
  pull_request:
  # `workflow_dispatch` allows CodSpeed to trigger backtest
  # performance analysis in order to generate initial data.
  workflow_dispatch:

# A push to a pull request makes the report of the run still going for its previous push moot,
# so that run is cancelled rather than left to use up runner minutes. Every run on main is kept:
# each is the baseline of the pull requests based on it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  benchmarks:
    name: Run benchmarks
    # A bare-metal CodSpeed macro runner, given to this job alone, so that the walltime numbers
    # move with the code rather than with the load of whoever shares a hosted runner's host. Keep
    # the job on this one label: two runs are only comparable when measured on the same machine.
    runs-on: codspeed-macro-arm64-graviton-ubuntu-22-04
    steps:
      - uses: actions/checkout@v7
      - name: Setup rust toolchain, cache and cargo-codspeed binary
        uses: moonrepo/setup-rust@v1
        with:
          channel: stable
          cache-target: release
          # setup-rust's cache key leaves the architecture out: without this, the job would find
          # the cache its x86_64 runs saved under the same key, and never save an arm64 one.
          cache-extra-identifier: ${{ runner.arch }}
          bins: cargo-codspeed
      - name: Build the benchmark target(s)
        run: cargo codspeed build -m walltime
      - name: Run the benchmarks
        uses: CodSpeedHQ/action@v5
        with:
          mode: walltime
          run: cargo codspeed run -m walltime
          token: ${{ secrets.CODSPEED_TOKEN }} # optional for public repos