name: CodSpeed Benchmarks

on:
  push:
    branches:
      - "main" # or "master"
  pull_request:
    # `ready_for_review` too, as a draft runs no walltime benchmarks until then.
    types: [opened, synchronize, reopened, ready_for_review]
  # `workflow_dispatch` allows CodSpeed to trigger backtest
  # performance analysis in order to generate initial data.
  workflow_dispatch:

# A push to a pull request makes the report of the run still going for its previous push moot,
# so that run is cancelled rather than left to use up runner minutes. Every run on main is kept:
# each is the baseline of the pull requests based on it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Every bench target of the workspace goes in exactly one of the two jobs that run them: CodSpeed
  # puts the results of the two together into one report, and takes each benchmark's from one. A
  # `--bench` picks the target of that name in every package that has one, so `benchmarks` picks
  # both zbus's and zbus_xml's. They are jobs of their own, rather than the entries of a matrix, as
  # only the walltime ones skip releases, which a job's `if` can't tell apart by its matrix entry.
  #
  # Each job builds the features that its targets need between them beyond the default ones, as
  # their `required-features` say (`connection` needs `bus-impl` and `serde_bytes`), and
  # `bus-impl`, which `benchmarks` measures the bus API of where it's enabled, so that
  # `serde_bytes` turns on none of the benchmarks of the simulation, such as those of byte arrays
  # in `wire`.
  #
  # Each function starts on a cache line of 64 bytes of its own. The simulation counts cache
  # misses, so the lines that the code of a function spans move the numbers of the benchmarks that
  # run it, and a change that grows or shrinks one function would otherwise move others to other
  # offsets in their lines, and the numbers of code that it doesn't touch with them. This covers
  # what cargo builds, but not the prebuilt standard library. cargo-codspeed adds its own flags to
  # these. The walltime builds keep the flag too, so that they build the same code as before.
  #
  # What runs on one thread and waits on no timer or socket: measured by simulating the CPU it runs
  # on, which counts the same instructions and cache misses on every run, on any runner, so a
  # GitHub-hosted one does.
  simulation:
    name: Run benchmarks (simulation)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - &checkout
        uses: actions/checkout@v7
      - &setup-rust
        name: Setup rust toolchain, cache and cargo-codspeed binary
        uses: moonrepo/setup-rust@v1
        env:
          # cargo-binstall looks the release of each binary up on GitHub's API, which limits
          # requests without a token: a lookup that hit the limit once stalled a job for 8 minutes.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          channel: stable
          cache-target: release
          # Only main saves the cache, which pull requests restore: the cache of a pull request
          # could only be restored by the later runs of that pull request, and would count against
          # the repository's limit, which could push main's out.
          cache-base: main
          # setup-rust's cache key leaves the architecture out: without this, the arm64 job would
          # find the cache the x86_64 one saved under the same key, and never save its own.
          cache-extra-identifier: ${{ runner.arch }}
          # The major version of cargo-codspeed goes with that of codspeed-criterion-compat, which
          # Cargo.lock pins: the two are bumped together.
          bins: cargo-codspeed@6.0.0
      - name: Build the benchmark targets
        env: &rustflags
          RUSTFLAGS: -C llvm-args=-align-all-functions=6
        run: >-
          cargo codspeed build -m simulation --features zbus/bus-impl
          --bench benchmarks --bench names --bench wire
      - name: Run the benchmarks
        uses: CodSpeedHQ/action@v5
        with:
          mode: simulation
          run: cargo codspeed run -m simulation --bench benchmarks --bench names --bench wire
          token: ${{ secrets.CODSPEED_TOKEN }} # optional for public repos

  # Whether the walltime benchmarks are worth the macro runner for this run: they are not for a
  # change that touches nothing that they build or run. A job of its own, on a GitHub-hosted runner,
  # so that a run that skips them builds nothing for them, and waits for no macro runner. The
  # simulation runs whatever changes, as CodSpeed's check, which the branch protection of main
  # requires, needs its upload.
  changes:
    name: Look for what the walltime benchmarks measure
    runs-on: ubuntu-latest
    outputs:
      measured: ${{ steps.look.outputs.measured }}
    steps:
      - uses: actions/checkout@v7
        with:
          # A pull request is checked out as its merge into the base branch, whose first parent is
          # the base: what the two differ in is what the pull request changes.
          fetch-depth: 2
      - id: look
        name: Look at what changed
        env:
          BEFORE: ${{ github.event.before }}
          # What can't change what the walltime benchmarks measure, nor how they run:
          # documentation and images, the repository's settings, the other workflows, the files of
          # the other CI jobs, the tests, the examples and the fuzzing of each package, and the
          # packages that the walltime targets don't use.
          UNMEASURED: |-
            \.md$
            \.(png|gif|svg)$
            ^LICENSE(-MIT)?$
            ^\.github/
            ^\.githooks/
            ^(book|docs|CI|test_fixtures)/
            ^[^/]+/tests/
            ^zbus/(examples|fuzz)/
            ^zbus_xml(gen)?/
            ^release-plz\.toml$
            ^\.(codespellrc|commitlintrc\.mjs|editorconfig|gitignore|mailmap)$
        run: |
          case "$GITHUB_EVENT_NAME" in
            pull_request) base=HEAD^1 ;;
            push)
              git fetch --quiet --depth=1 origin "$BEFORE"
              base=$BEFORE
              ;;
            *)
              echo measured=true >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac
          changed=$(git diff --name-only "$base" HEAD)
          # A file that matches none of the patterns of `UNMEASURED`, one to a line, is measured.
          if grep -qvE -f <(printf '%s\n' "$UNMEASURED") <<< "$changed" ||
            grep -qx '\.github/workflows/bench\.yml' <<< "$changed"; then
            echo measured=true >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Nothing that the walltime benchmarks measure changed: they don't run."
            echo measured=false >> "$GITHUB_OUTPUT"
          fi

  # What waits on timers, sockets or other threads: in the kernel, which the simulation leaves
  # out, so measured by the clock. On a bare-metal CodSpeed macro runner, given to this job alone,
  # so that the numbers move with the code rather than with the load of whoever shares a hosted
  # runner's host. Keep the job on this one label: two runs are only comparable when measured on
  # the same machine.
  #
  # The benchmarks are built on a GitHub-hosted runner of the same architecture and the same
  # release of Ubuntu as the macro runner, which costs nothing, and only run on the macro runner,
  # so that the minutes of the macro runner go to running them rather than to building them.
  #
  # Nor are they worth it for a draft, which is pushed to again and again: they run once it is
  # marked as ready for review, and for each push after that. A release changes nothing that they
  # measure either: its pull request, which release-plz opens from a branch of its own, only bumps
  # versions and changelogs, and so does its merge, which `release.yml` tells apart by the release
  # emoji of its commits, as this does. Wherever they don't run, CodSpeed takes the results of the
  # walltime ids from the run that it compares this one with, and the job that runs them, which
  # needs this one, is skipped with it.
  #
  # The id of the build stays `benchmarks`, which the walltime entry of a matrix had before, as
  # setup-rust's cache key hashes the id: on the same architecture and release of Ubuntu as the
  # macro runner, the build goes on from the cache that the macro runner saved.
  benchmarks:
    name: Build benchmarks (walltime)
    needs: changes
    runs-on: ubuntu-22.04-arm
    if: >-
      ${{ needs.changes.outputs.measured == 'true' && !github.event.pull_request.draft &&
      !(github.event_name == 'pull_request' && startsWith(github.head_ref, 'release-plz-')) &&
      !(github.event_name == 'push' && contains(join(github.event.commits.*.message), '🔖')) }}
    timeout-minutes: 30
    steps:
      - *checkout
      - *setup-rust
      - name: Build the benchmark targets
        env: *rustflags
        run: >-
          cargo codspeed build -m walltime --features zbus/bus-impl,zbus/serde_bytes
          --bench runtime --bench connection
      # cargo-codspeed goes along, as the macro runner would otherwise install it too. A tarball
      # keeps the executable bits, which an artifact drops.
      - name: Pack the benchmarks
        run: tar -czf walltime.tar.gz target/codspeed/walltime -C ~/.cargo/bin cargo-codspeed
      - uses: actions/upload-artifact@v7
        with:
          name: walltime-benchmarks
          path: walltime.tar.gz
          retention-days: 1
  walltime:
    name: Run benchmarks (walltime)
    needs: benchmarks
    runs-on: codspeed-macro-arm64-graviton-ubuntu-22-04
    # The job takes a minute or two: one that takes longer than 15 is stuck, and would hold the
    # macro runner until GitHub's own limit of 6 hours.
    timeout-minutes: 15
    steps:
      # cargo-codspeed reads the workspace with `cargo metadata`, and the benchmarks name their
      # sources by their paths in it.
      - *checkout
      # The cargo of the runner's image, 1.81, can't read a workspace of the 2024 edition. Nothing
      # is built here, so the cache, which holds what the build of the benchmarks needs, is left
      # out.
      - name: Setup rust toolchain
        uses: moonrepo/setup-rust@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          channel: stable
          cache: false
      - uses: actions/download-artifact@v8
        with:
          name: walltime-benchmarks
      - name: Unpack the benchmarks
        run: |
          tar -xzf walltime.tar.gz
          install -m 755 cargo-codspeed ~/.cargo/bin/
      - name: Run the benchmarks
        uses: CodSpeedHQ/action@v5
        with:
          mode: walltime
          # Nothing is ever saved to the cache of CodSpeed's instruments on the macro runner.
          cache-instruments: false
          # criterion's warm-up of 3 s and measurement of 5 s for each id give way to 1 s and 2 s:
          # the numbers spread far more from one run to the next, on the machines of the macro
          # runner, than within a run, so the longer ones bought little but minutes. No plots are
          # drawn, as nothing reads them.
          run: >-
            cargo codspeed run -m walltime --bench runtime --bench connection --
            --warm-up-time 1 --measurement-time 2 --noplot
          token: ${{ secrets.CODSPEED_TOKEN }} # optional for public repos
