name: CodSpeed Benchmarks

on:
  push:
    branches:
      - "main" # or "master"
  pull_request:
  # `workflow_dispatch` allows CodSpeed to trigger backtest
  # performance analysis in order to generate initial data.
  workflow_dispatch:

# A push to a pull request makes the report of the run still going for its previous push moot,
# so that run is cancelled rather than left to use up runner minutes. Every run on main is kept:
# each is the baseline of the pull requests based on it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  benchmarks:
    name: Run benchmarks (${{ matrix.mode }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        # Every bench target of the workspace goes in exactly one of the two lists: CodSpeed puts
        # the results of the two jobs together into one report, and takes each benchmark's from
        # one. A `--bench` picks the target of that name in every package that has one, so
        # `benchmarks` picks both zbus's and zbus_xml's.
        include:
          # What runs on one thread and waits on no timer or socket: measured by simulating the
          # CPU it runs on, which counts the same instructions and cache misses on every run, on
          # any runner, so a GitHub-hosted one does.
          - mode: simulation
            runner: ubuntu-latest
            benches: --bench benchmarks --bench names --bench wire
          # What waits on timers, sockets or other threads: in the kernel, which the simulation
          # leaves out, so measured by the clock. On a bare-metal CodSpeed macro runner, given to
          # this job alone, so that the numbers move with the code rather than with the load of
          # whoever shares a hosted runner's host. Keep the job on this one label: two runs are only
          # comparable when measured on the same machine.
          - mode: walltime
            runner: codspeed-macro-arm64-graviton-ubuntu-22-04
            benches: --bench runtime
    steps:
      - uses: actions/checkout@v7
      - name: Setup rust toolchain, cache and cargo-codspeed binary
        uses: moonrepo/setup-rust@v1
        with:
          channel: stable
          cache-target: release
          # setup-rust's cache key leaves the architecture out: without this, the arm64 job would
          # find the cache the x86_64 one saved under the same key, and never save its own.
          cache-extra-identifier: ${{ runner.arch }}
          bins: cargo-codspeed
      # The features the bench targets need between them beyond the default ones, as their
      # `required-features` say, and `bus-impl`, which `benchmarks` measures the bus API of where
      # it's enabled; each job builds its own targets only.
      #
      # Each function starts on a cache line of 64 bytes of its own. The simulation counts cache
      # misses, so the lines that the code of a function spans move the numbers of the benchmarks
      # that run it, and a change that grows or shrinks one function would otherwise move others
      # to other offsets in their lines, and the numbers of code that it doesn't touch with them.
      # This covers what cargo builds, but not the prebuilt standard library. cargo-codspeed adds
      # its own flags to these.
      - name: Build the benchmark target(s)
        env:
          RUSTFLAGS: -C llvm-args=-align-all-functions=6
        run: cargo codspeed build -m ${{ matrix.mode }} --features zbus/bus-impl ${{ matrix.benches }}
      - name: Run the benchmarks
        uses: CodSpeedHQ/action@v5
        with:
          mode: ${{ matrix.mode }}
          run: cargo codspeed run -m ${{ matrix.mode }} ${{ matrix.benches }}
          token: ${{ secrets.CODSPEED_TOKEN }} # optional for public repos